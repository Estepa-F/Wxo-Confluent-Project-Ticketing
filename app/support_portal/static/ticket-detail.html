<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/static/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket Details</title>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-brand">
      <div class="topbar-icon">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 6l1.5 11a1.5 1.5 0 0 0 1.5 1.3h9a1.5 1.5 0 0 0 1.5-1.3L19 6M9 6V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V6"/></svg>
      </div>
      <span class="topbar-title">E-Shop Support</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="user-greeting" id="userGreeting"></span>
      <span id="tierBadge" class="tier-badge" hidden></span>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" hidden><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="content" id="content" hidden>
    <div class="panel">
      <div class="detail-top">
        <span class="status-pill" id="statusPill"></span>
        <span class="ticket-number" id="ticketNumber"></span>
      </div>
      <h1 class="detail-subject" id="detailSubject"></h1>
      <div class="detail-meta" id="detailMeta"></div>
      <div class="detail-created" id="detailCreated"></div>
      <div class="detail-description" id="detailDescription" hidden></div>
    </div>

    <div class="panel" id="infoPanel">
      <div class="panel-title">Ticket Information</div>
      <div class="info-row"><span class="info-row-label">Service</span><span class="info-row-value" id="infoService"></span></div>
      <div class="info-row"><span class="info-row-label">Priority</span><span class="info-row-value" id="infoPriority"></span></div>
      <div class="info-row"><span class="info-row-label">Created</span><span class="info-row-value" id="infoCreated"></span></div>
      <div class="info-row"><span class="info-row-label">Last updated</span><span class="info-row-value" id="infoUpdated"></span></div>
    </div>

    <div class="panel">
      <div class="panel-title">Activity</div>
      <div class="timeline" id="timeline"></div>
      <div class="inline-status" id="turnIndicator" hidden></div>
    </div>

    <div id="actions">
      <div class="reply-composer" id="replyComposer" hidden>
        <div class="field">
          <span class="field-label">Your reply</span>
          <textarea class="full" id="replyText" maxlength="500"></textarea>
          <span class="char-counter"><span id="replyCount">0</span>/500</span>
        </div>
        <div class="reply-actions">
          <button class="btn btn-secondary" id="cancelReplyBtn">Cancel</button>
          <button class="btn btn-primary" id="sendReplyBtn" disabled>Send reply</button>
        </div>
        <div class="inline-status" id="replyStatus"></div>
      </div>

      <button class="btn btn-primary btn-block" id="addReplyBtn" style="margin-bottom:10px;">Add a reply</button>
      <button class="btn btn-secondary btn-block" id="closeTicketBtn">Close ticket</button>
    </div>

    <div class="inline-status" id="closedFooter" hidden>This ticket is closed.</div>
  </div>

  <nav class="bottom-nav">
    <a href="/">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      New Ticket
    </a>
    <a href="/tickets" class="active">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/></svg>
      My Tickets
    </a>
  </nav>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-dialog">
    <h3>Close this ticket?</h3>
    <p>You won't be able to add more replies after closing it.</p>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="cancelCloseBtn">Cancel</button>
      <button class="btn btn-primary" id="confirmCloseBtn">Close ticket</button>
    </div>
  </div>
</div>

<script>
  const ticketId = window.location.pathname.split('/').filter(Boolean).pop();

  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? match[1] : null;
  }

  const userId = getCookie('user_id');
  if (userId) document.getElementById('userGreeting').textContent = `User#${userId}`;

  const tier = getCookie('tier');
  if (tier) {
    const badge = document.getElementById('tierBadge');
    badge.textContent = tier.charAt(0).toUpperCase() + tier.slice(1);
    badge.classList.add('tier-' + tier);
    badge.hidden = false;
  }

  const SERVICE_LABEL = {
    login: 'Login', checkout: 'Checkout', payments: 'Payments',
    search: 'Search', notifications: 'Notifications', 'order-tracking': 'Order tracking',
  };
  const STATUS_LABEL = { open: 'Open', closed: 'Closed' };
  // Derived from the last event's type, not ticket status (which is just
  // open/closed) -- tells the attendee whose turn it is without a formal
  // status field for every possible turn.
  const TURN_INDICATOR = {
    ticket_created: { text: 'Processing your request…', cls: '' },
    user_reply: { text: 'Processing your request…', cls: '' },
    automatic_reply: { text: 'Waiting on your reply', cls: 'accent' },
    support_reply: { text: 'Waiting on your reply', cls: 'accent' },
    escalated: { text: 'Escalated', cls: 'amber' },
  };
  const EVENT_META = {
    ticket_created: { label: 'Ticket created', dot: 'dot-blue', fallback: 'Your request has been submitted.' },
    automatic_reply: { label: 'Automatic reply', dot: 'dot-green', fallback: '' },
    escalated: { label: 'Escalated to support', dot: 'dot-amber', fallback: 'Your request needs additional review.' },
    user_reply: { label: 'Your reply', dot: 'dot-blue', fallback: '' },
    support_reply: { label: 'Support reply', dot: 'dot-green', fallback: '' },
    ticket_closed: { label: 'Ticket closed', dot: 'dot-green', fallback: 'This ticket has been closed. If you need further assistance, please create a new ticket.' },
  };

  let ticket = null;

  function shortId(id) { return '#' + id.replace(/-/g, '').slice(0, 5).toUpperCase(); }
  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function fmtTime(iso) {
    return new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function fmtShortTime(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function renderTimeline() {
    document.getElementById('timeline').innerHTML = ticket.events.map(evt => {
      const meta = EVENT_META[evt.type] || { label: evt.type, dot: 'dot-blue', fallback: '' };
      const message = evt.message || meta.fallback;
      return `
        <div class="timeline-item">
          <div class="timeline-rail">
            <div class="timeline-dot ${meta.dot}"></div>
            <div class="timeline-line"></div>
          </div>
          <div class="timeline-body">
            <div class="timeline-label">${meta.label}</div>
            <div class="timeline-time">${fmtShortTime(evt.created_at)}</div>
            ${message ? `<div class="timeline-message">${escapeHtml(message)}</div>` : ''}
          </div>
        </div>`;
    }).join('');

    const turnEl = document.getElementById('turnIndicator');
    const lastEvent = ticket.events[ticket.events.length - 1];
    const indicator = ticket.status === 'closed' ? null : (lastEvent && TURN_INDICATOR[lastEvent.type]);
    if (indicator) {
      turnEl.textContent = indicator.text;
      turnEl.className = 'inline-status' + (indicator.cls ? ' ' + indicator.cls : '');
      turnEl.hidden = false;
    } else {
      turnEl.hidden = true;
    }
  }

  function render() {
    document.getElementById('content').hidden = false;
    document.getElementById('statusPill').textContent = STATUS_LABEL[ticket.status];
    document.getElementById('statusPill').className = 'status-pill status-' + ticket.status;
    document.getElementById('ticketNumber').textContent = shortId(ticket.ticket_id);
    document.getElementById('detailSubject').textContent = ticket.subject;
    document.getElementById('detailMeta').textContent =
      `${SERVICE_LABEL[ticket.service] || ticket.service} • ${ticket.urgency[0].toUpperCase()}${ticket.urgency.slice(1)} priority`;
    document.getElementById('detailCreated').textContent = 'Created ' + fmtTime(ticket.created_at);
    const descEl = document.getElementById('detailDescription');
    if (ticket.description) {
      descEl.textContent = ticket.description;
      descEl.hidden = false;
    } else {
      descEl.hidden = true;
    }

    document.getElementById('infoService').textContent = SERVICE_LABEL[ticket.service] || ticket.service;
    document.getElementById('infoPriority').textContent = ticket.urgency[0].toUpperCase() + ticket.urgency.slice(1);
    document.getElementById('infoCreated').textContent = fmtShortTime(ticket.created_at);
    document.getElementById('infoUpdated').textContent = fmtShortTime(ticket.updated_at);

    renderTimeline();

    const closed = ticket.status === 'closed';
    document.getElementById('addReplyBtn').hidden = closed;
    document.getElementById('closeTicketBtn').hidden = closed;
    document.getElementById('closedFooter').hidden = !closed;
    if (closed) {
      document.getElementById('replyComposer').hidden = true;
    }
  }

  // ---- reply composer ----
  const replyComposer = document.getElementById('replyComposer');
  const addReplyBtn = document.getElementById('addReplyBtn');
  const replyText = document.getElementById('replyText');
  const sendReplyBtn = document.getElementById('sendReplyBtn');

  addReplyBtn.addEventListener('click', () => {
    replyComposer.hidden = false;
    addReplyBtn.hidden = true;
    replyText.focus();
  });
  document.getElementById('cancelReplyBtn').addEventListener('click', () => {
    replyComposer.hidden = true;
    addReplyBtn.hidden = false;
    replyText.value = '';
    document.getElementById('replyCount').textContent = '0';
    document.getElementById('replyStatus').textContent = '';
    sendReplyBtn.disabled = true;
  });
  replyText.addEventListener('input', () => {
    document.getElementById('replyCount').textContent = replyText.value.length;
    sendReplyBtn.disabled = replyText.value.trim().length === 0;
  });

  sendReplyBtn.addEventListener('click', async () => {
    const message = replyText.value.trim();
    if (!message) return;
    sendReplyBtn.disabled = true;
    document.getElementById('replyStatus').textContent = 'Processing your reply…';
    try {
      const res = await fetch(`/api/tickets/${ticketId}/replies`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message }),
      });
      if (!res.ok) throw new Error('failed');
      const event = await res.json();
      ticket.events.push(event);
      ticket.status = 'open';
      ticket.updated_at = event.created_at;
      render();
      replyText.value = '';
      document.getElementById('replyCount').textContent = '0';
      document.getElementById('replyStatus').textContent = '';
      replyComposer.hidden = true;
    } catch (e) {
      document.getElementById('replyStatus').textContent = "We couldn't send your reply. Your message has not been lost.";
      sendReplyBtn.disabled = false;
    }
  });

  // ---- close ticket ----
  const confirmOverlay = document.getElementById('confirmOverlay');
  document.getElementById('closeTicketBtn').addEventListener('click', () => confirmOverlay.classList.add('open'));
  document.getElementById('cancelCloseBtn').addEventListener('click', () => confirmOverlay.classList.remove('open'));
  document.getElementById('confirmCloseBtn').addEventListener('click', async () => {
    try {
      const res = await fetch(`/api/tickets/${ticketId}/close`, { method: 'POST' });
      if (!res.ok) throw new Error('failed');
      await loadTicket();
    } catch (e) {
      // Keep the demo moving even if this particular call fails.
    } finally {
      confirmOverlay.classList.remove('open');
    }
  });

  // ---- load + live updates ----
  async function loadTicket() {
    const res = await fetch(`/api/tickets/${ticketId}`);
    if (!res.ok) throw new Error('failed');
    ticket = await res.json();
    render();
  }

  function connectWs() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws/tickets/${ticketId}`);
    ws.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'snapshot') {
        ticket = msg.data;
        render();
      } else if (msg.type === 'ticket_event' && ticket) {
        if (!ticket.events.some(e => e.event_id === msg.event.event_id)) {
          ticket.events.push(msg.event);
        }
        ticket.status = msg.status;
        ticket.updated_at = msg.event.created_at;
        render();
      }
    };
    ws.onclose = () => setTimeout(connectWs, 2000);
    ws.onerror = () => ws.close();
  }

  loadTicket().catch(() => {
    document.getElementById('content').hidden = false;
    document.getElementById('content').innerHTML = '<div class="empty-state">We couldn\'t load this ticket. Please try again.</div>';
  });
  connectWs();
</script>
</body>
</html>
