<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/static/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Shop Support</title>
<style>
  :root { --bg: #f5f6f9; --text: #1b1f2b; --border: #d8dce6; --bg-elevated-2: #eef0f5; --text-dim: #5b6478; }
  html[data-theme="dark"] { --bg: #0a0d14; --text: #e7eaf2; --border: #232a3a; --bg-elevated-2: #171c28; --text-dim: #9299ad; }
  [hidden] { display: none !important; }
  body {
    font-family: -apple-system, sans-serif; text-align: center; padding: 40px 16px;
    background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; box-sizing: border-box;
  }
  .theme-toggle {
    position: fixed; top: 16px; right: 16px;
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg-elevated-2); color: var(--text-dim); cursor: pointer; padding: 0;
  }
  .theme-toggle .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
</style>
</head>
<body>
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme">
    <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon icon-moon" viewBox="0 0 24 24" hidden><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <h1>Thanks for stopping by!</h1>
  <p>We've reached capacity for live ticket submissions right now &mdash; sit back and watch the dashboard instead.</p>
</body>
</html>
